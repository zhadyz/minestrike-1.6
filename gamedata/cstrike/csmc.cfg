// Counter-Strike: Minecraft Edition - server settings (executed at map start via listenserver.cfg)
// The clocks. A wall buys seconds, so seconds have to be worth something: a round of two and a half
// minutes, ten seconds to buy and look at each other, half a minute of buying, forty seconds on the bomb.
mp_freezetime 10
mp_roundtime 2.5
mp_buytime 0.5
mp_c4timer 40
mp_autoteambalance 0
mp_limitteams 0
bot_difficulty 2
bot_join_after_player 0
bot_chatter off
sv_cheats 1
mc_buy_opens_inventory 1
mc_xp_per_kill 12
bot_quota 6
// Minecraft rules: a dead player drops everything (guns, grenades and every Minecraft item)
mp_weapondrop 3
mp_nadedrops 2
